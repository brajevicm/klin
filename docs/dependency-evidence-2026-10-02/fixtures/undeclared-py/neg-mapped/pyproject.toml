[project]
name = "ledger"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6",
  "python-dateutil>=2.9",
  "google-cloud-storage>=2",
  "pywin32>=306; sys_platform == 'win32'",
  "Pillow>=10",
  "PyJWT>=2",
  "scikit-learn>=1.4",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
fast = ["orjson>=3"]

[dependency-groups]
dev = ["pytest>=8"]
