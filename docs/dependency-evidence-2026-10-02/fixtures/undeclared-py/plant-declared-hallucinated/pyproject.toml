[project]
name = "ledger"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6",
  "python-dateutil>=2.9",
  "google-cloud-storage>=2",
  "pywin32>=306; sys_platform == 'win32'",
  "tabular-guard>=0.3",
]

[project.optional-dependencies]
fast = ["orjson>=3"]

[dependency-groups]
dev = ["pytest>=8"]
