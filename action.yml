name: klin
description: Install a pinned klin release and run klin check. Spec 12.3.
inputs:
  version:
    description: >-
      The release to install, without the v. When empty, the tag this action is
      pinned at, then the latest release.
    required: false
    default: ""
  args:
    description: >-
      Arguments appended to klin check, such as check names or --changed. The
      action adds --json itself to write annotations and the job summary.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install klin
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        version="$INPUT_VERSION"
        [ -n "$version" ] || case "$ACTION_REF" in v[0-9]*) version="${ACTION_REF#v}" ;; esac
        if [ -n "$version" ]; then
          url="https://github.com/brajevicm/klin/releases/download/v$version/klin-installer.sh"
        else
          url="https://github.com/brajevicm/klin/releases/latest/download/klin-installer.sh"
        fi
        export KLIN_INSTALL_DIR="$RUNNER_TEMP/klin" KLIN_NO_MODIFY_PATH=1
        curl --proto '=https' --tlsv1.2 -LsSf "$url" | sh
        dirname "$(find "$KLIN_INSTALL_DIR" -type f -name klin | head -1)" >> "$GITHUB_PATH"
    - name: Gate
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        report="$RUNNER_TEMP/klin-check.json"
        klin check $ARGS --json > "$report"
        code=$?
        if jq -e 'type == "object"' "$report" > /dev/null 2>&1; then
          jq -r --arg part annotations -f "$GITHUB_ACTION_PATH/action/report.jq" "$report"
          jq -r --arg part summary -f "$GITHUB_ACTION_PATH/action/report.jq" "$report" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          cat "$report"
        fi
        exit "$code"
