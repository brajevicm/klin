name: klin
description: Install a pinned klin release and run klin gate --strict. Spec 19.4.
inputs:
  version:
    description: >-
      The release to install, without the v. When empty, the version klin.json
      names, then the tag this action is pinned at, then the latest release.
    required: false
    default: ""
  args:
    description: Arguments appended to klin gate --strict, such as --gate names or --json.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install klin
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        version="$INPUT_VERSION"
        [ -n "$version" ] || version=$(jq -r '.version // empty' klin.json 2>/dev/null || true)
        [ -n "$version" ] || case "$ACTION_REF" in v[0-9]*) version="${ACTION_REF#v}" ;; esac
        if [ -n "$version" ]; then
          url="https://github.com/brajevicm/klin/releases/download/v$version/klin-installer.sh"
        else
          url="https://github.com/brajevicm/klin/releases/latest/download/klin-installer.sh"
        fi
        export KLIN_INSTALL_DIR="$RUNNER_TEMP/klin" KLIN_NO_MODIFY_PATH=1
        curl --proto '=https' --tlsv1.2 -LsSf "$url" | sh
        dirname "$(find "$KLIN_INSTALL_DIR" -type f -name klin | head -1)" >> "$GITHUB_PATH"
    - name: Gate
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: klin gate --strict $ARGS
