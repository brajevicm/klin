name: release plan

# dist's own release.yml skips pull requests (`pr-run-mode = "skip"`), so a pull request that
# touches a release input runs `dist plan` here. It fails when the release configuration no
# longer resolves or when release.yml is out of date with it.
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "dist-workspace.toml"
      - ".github/workflows/release.yml"
      - ".github/verify-tag.yml"
      - ".github/workflows/release-plan.yml"
      - ".github/workflows/cut-release.yml"
      - ".github/workflows/promote-release.yml"
      - "action.yml"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".agents/plugins/**"
      - "plugins/klin/.claude-plugin/**"
      - "plugins/klin/.cursor-plugin/**"

concurrency:
  group: release-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - shell: bash
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
      - run: dist plan --output-format=json
