name: publish-release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Validate and tag the merged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [[ "$PR_BODY" != *"<!-- klin-release-pr -->"* ]]; then
            echo "::error title=Untrusted release PR::The merged release branch is missing the prepare-release marker."
            exit 1
          fi

          version="${HEAD_REF#release/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release branch::$HEAD_REF does not name an X.Y.Z release."
            exit 1
          fi
          tag="v$version"

          expected_files=$(cat <<'EOF'
          .agents/plugins/marketplace.json
          .claude-plugin/marketplace.json
          Cargo.lock
          Cargo.toml
          README.md
          plugins/klin/.claude-plugin/plugin.json
          plugins/klin/.cursor-plugin/plugin.json
          EOF
          )
          actual_files=$(gh api --paginate "/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' | LC_ALL=C sort)

          if [[ "$actual_files" != "$expected_files" ]]; then
            echo "::error title=Unexpected release diff::Release PR #$PR_NUMBER does not contain exactly the cargo-release-owned files."
            diff -u <(printf '%s\n' "$expected_files") <(printf '%s\n' "$actual_files") || true
            exit 1
          fi

          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error title=Version mismatch::$HEAD_REF names $version but Cargo.toml has $cargo_version."
            exit 1
          fi

          lock_version=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.lock", "rb") as f:
              packages = tomllib.load(f)["package"]
          versions = [p["version"] for p in packages if p["name"] == "klin"]
          if len(versions) != 1:
              raise SystemExit(f"expected one klin package in Cargo.lock, found {len(versions)}")
          print(versions[0])
          PY
          )
          if [[ "$lock_version" != "$version" ]]; then
            echo "::error title=Version mismatch::Cargo.lock has $lock_version instead of $version."
            exit 1
          fi

          for manifest in \
            plugins/klin/.claude-plugin/plugin.json \
            plugins/klin/.cursor-plugin/plugin.json
          do
            held=$(jq -r '.version' "$manifest")
            [[ "$held" == "$version" ]] || {
              echo "::error title=Version mismatch::$manifest has $held instead of $version."
              exit 1
            }
          done

          for market in .claude-plugin/marketplace.json .agents/plugins/marketplace.json
          do
            held=$(jq -r '.plugins[0].source.ref' "$market")
            [[ "$held" == "$tag" ]] || {
              echo "::error title=Version mismatch::$market names $held instead of $tag."
              exit 1
            }
          done

          grep -Fq "brajevicm/klin@$tag" README.md
          grep -Fq -- "--branch $tag" README.md

          checks=$(gh api "/repos/$REPOSITORY/commits/$PR_HEAD_SHA/check-runs?per_page=100")
          for required in gates plan
          do
            conclusion=$(required="$required" jq -r '
              [.check_runs[] | select(.name == env.required)]
              | sort_by(.completed_at)
              | last
              | .conclusion // ""
            ' <<<"$checks")
            if [[ "$conclusion" != "success" ]]; then
              echo "::error title=Required check not green::$required concluded '$conclusion' on release PR head $PR_HEAD_SHA."
              exit 1
            fi
          done

          git fetch origin main --tags
          if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
            echo "::error title=Merge commit missing::$MERGE_SHA is not contained in origin/main."
            exit 1
          fi

          if existing=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}"); then
            if [[ "$existing" != "$MERGE_SHA" ]]; then
              echo "::error title=Release tag already exists::$tag points to $existing, not merged commit $MERGE_SHA. Tags are never moved."
              exit 1
            fi
            echo "$tag already points to $MERGE_SHA; publication is an idempotent retry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag -a "$tag" "$MERGE_SHA" -m "Release $version"

          # RELEASE_TOKEN is intentionally used for this push: a tag created by the
          # workflow's GITHUB_TOKEN would not trigger the tag-based Release workflow.
          git push origin "refs/tags/$tag"

          {
            printf 'Published **%s** from merged commit %s.\n' "$tag" "$MERGE_SHA"
            echo
            echo "cargo-dist now owns GitHub Release creation, artifacts, installers and Latest."
          } >> "$GITHUB_STEP_SUMMARY"
