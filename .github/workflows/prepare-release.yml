name: prepare-release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Which part of the version moves
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: Exact X.Y.Z version instead. Wins over the level when set.
        type: string
        default: ""

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-release@1.1.5

      - name: Prepare or refresh the release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          LEVEL: ${{ inputs.level }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ -n "$VERSION" ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error title=Invalid version::Expected X.Y.Z, got '$VERSION'."
              exit 1
            }
            expected="$VERSION"
          else
            IFS=. read -r major minor patch <<<"$current"
            case "$LEVEL" in
              major) expected="$((major + 1)).0.0" ;;
              minor) expected="$major.$((minor + 1)).0" ;;
              patch) expected="$major.$minor.$((patch + 1))" ;;
            esac
          fi

          branch="release/v$expected"
          existing=$(gh pr list --state all --base main --head "$branch" --limit 1 \
            --json number,state,mergedAt,url --jq '.[0] // empty')

          if [[ -n "$existing" ]]; then
            merged=$(jq -r '.mergedAt // ""' <<<"$existing")
            state=$(jq -r '.state' <<<"$existing")
            url=$(jq -r '.url' <<<"$existing")
            if [[ -n "$merged" ]]; then
              {
                echo "Release PR already merged: $url"
                echo
                echo "If publication failed, rerun the corresponding **publish-release** workflow run. Do not prepare the version again."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$state" == "CLOSED" ]]; then
              echo "::error title=Release PR closed::$url was closed without merging. Reopen it or choose a different version."
              exit 1
            fi
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          cargo release "${VERSION:-$LEVEL}" --execute --no-confirm --no-tag

          actual=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=Version mismatch::Expected $expected, cargo-release prepared $actual."
            exit 1
          fi

          # Regenerate an open release PR from current main. The branch is generated state;
          # force-with-lease prevents overwriting a concurrent update.
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          body=$(cat <<'EOF'
          <!-- klin-release-pr -->
          Prepared by `.github/workflows/prepare-release.yml`.

          Merging this PR publishes **v__VERSION__** from the exact merged commit.

          - Normal `quality / gates` is authoritative.
          - No local release commands are required.
          - Manual host smoke is not required for an ordinary release; use the host compatibility ledger for host-sensitive changes.
          EOF
          )
          body=${body//__VERSION__/$expected}

          if [[ -n "$existing" ]]; then
            number=$(jq -r '.number' <<<"$existing")
            gh pr edit "$number" --title "release: v$expected" --body "$body"
            url=$(jq -r '.url' <<<"$existing")
          else
            url=$(gh pr create --base main --head "$branch" \
              --title "release: v$expected" --body "$body")
          fi

          {
            echo "Prepared **v$expected**."
            echo
            echo "Release PR: $url"
            echo
            echo "Merge that PR after the normal required checks pass. The merge publishes the tag and starts cargo-dist automatically."
          } >> "$GITHUB_STEP_SUMMARY"
