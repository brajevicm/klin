name: benchmark

on:
  # `labeled` is not a default type, and the `benchmark` label needs a run of its own.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Both binaries run over this tree at this commit, with a state directory each, so only the
      # binary differs. The base build shares the target directory, so it recompiles klin alone.
      # The base is the checkout's first parent: for a pull request that is the main the merge ref
      # was built on, which `pull_request.base.sha` is not once main moves, and for a push to main
      # it is the commit before.
      - name: Measure the base binary and this branch's binary
        run: |
          cargo build --release --locked
          cp target/release/klin "$RUNNER_TEMP/klin-head"
          git worktree add "$RUNNER_TEMP/base" "$(git rev-parse HEAD^1)"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/base/Cargo.toml"
          cp target/release/klin "$RUNNER_TEMP/klin-base"
          for side in base head; do
            KLIN_STATE_DIR="$RUNNER_TEMP/state-$side" "$RUNNER_TEMP/klin-$side" \
              gate --strict --json > "$RUNNER_TEMP/$side.json" || true
          done

      # The dense fixture takes tens of minutes, so a pull request opts in with the `benchmark`
      # label. `KLIN_BIN` is set on both sides, so both rows build the same fixture sections.
      - name: Measure the dense 300k fixture with each binary
        if: contains(github.event.pull_request.labels.*.name, 'benchmark')
        env:
          KLIN_PERF_ROW: structural_300k
          KLIN_PERF_CASE: full
        run: |
          set -o pipefail
          for side in base head; do
            KLIN_BIN="$RUNNER_TEMP/klin-$side" \
              cargo test --release --locked --test performance -- --ignored perf --nocapture \
              > "$RUNNER_TEMP/$side-dense.txt"
            grep -oE '[A-Za-z_][A-Za-z0-9_.-]*=[0-9]+\b' "$RUNNER_TEMP/$side-dense.txt" \
              | jq -R -s 'split("\n") | map(select(length > 0) | split("="))
                          | map({key: .[0], value: (.[1] | tonumber)}) | from_entries' \
              > "$RUNNER_TEMP/$side-dense.json"
          done

      - name: Render the benchmark comment
        run: |
          if [ -f "$RUNNER_TEMP/base-dense.json" ]; then
            jq -n -r \
              --slurpfile strict_base "$RUNNER_TEMP/base.json" \
              --slurpfile strict_head "$RUNNER_TEMP/head.json" \
              --slurpfile dense_base "$RUNNER_TEMP/base-dense.json" \
              --slurpfile dense_head "$RUNNER_TEMP/head-dense.json" \
              -f .github/bench.jq
          else
            jq -n -r \
              --slurpfile strict_base "$RUNNER_TEMP/base.json" \
              --slurpfile strict_head "$RUNNER_TEMP/head.json" \
              --argjson dense_base '[{}]' \
              --argjson dense_head '[{}]' \
              -f .github/bench.jq
          fi | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/bench.md"

      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$NUMBER" --edit-last --create-if-none --body-file "$RUNNER_TEMP/bench.md"
