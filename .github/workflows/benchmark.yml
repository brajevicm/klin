name: benchmark

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Both binaries run over this tree at this commit, with a state directory each, so only the
      # binary differs. The base build shares the target directory, so it recompiles klin alone.
      - name: Measure the base binary and this branch's binary
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          cargo build --release --locked
          cp target/release/klin "$RUNNER_TEMP/klin-head"
          git worktree add "$RUNNER_TEMP/base" "${PR_BASE:-$(git rev-parse HEAD^)}"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/base/Cargo.toml"
          cp target/release/klin "$RUNNER_TEMP/klin-base"
          for side in base head; do
            KLIN_STATE_DIR="$RUNNER_TEMP/state-$side" "$RUNNER_TEMP/klin-$side" \
              gate --strict --json > "$RUNNER_TEMP/$side.json" || true
          done

      - name: Compare the counters
        run: |
          jq -S --argjson base '{}' -f .github/bench.jq "$RUNNER_TEMP/base.json" > "$RUNNER_TEMP/flat.json"
          jq -r --argjson base "$(cat "$RUNNER_TEMP/flat.json")" -f .github/bench.jq \
            "$RUNNER_TEMP/head.json" | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/bench.md"

      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test -s "$RUNNER_TEMP/bench.md" || exit 0
          gh pr comment "$NUMBER" --edit-last --create-if-none --body-file "$RUNNER_TEMP/bench.md"

      - if: "!contains(github.event.pull_request.labels.*.name, 'benchmark-accepted')"
        run: '! grep -q ⚠ "$RUNNER_TEMP/bench.md"'
