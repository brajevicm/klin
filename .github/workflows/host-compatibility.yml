name: host compatibility

# A vendor-drift alarm, not a PR gate. It runs one golden lifecycle per host
# against the current stable release of Claude Code, Codex and Cursor.
on:
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [claude, codex, cursor]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: run the ${{ matrix.host }} canary
        id: canary
        env:
          ART: ${{ github.workspace }}/canary-artifacts/${{ matrix.host }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CODEX_TRUST_COMMAND: ${{ vars.CODEX_TRUST_COMMAND }}
        run: ci/host-canary.sh ${{ matrix.host }}
      - name: read the classification
        if: always()
        id: read
        run: |
          file=canary-artifacts/${{ matrix.host }}/classification.txt
          echo "class=$(cat "$file" 2>/dev/null || echo INFRA)" >> "$GITHUB_OUTPUT"
      - name: keep the evidence
        if: always() && steps.read.outputs.class != 'PASS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-${{ matrix.host }}-${{ steps.read.outputs.class }}
          path: canary-artifacts/${{ matrix.host }}
          if-no-files-found: warn
      - name: warn on an inconclusive run
        if: always() && steps.read.outputs.class != 'PASS' && steps.read.outputs.class != 'COMPAT'
        run: |
          echo "::warning title=${{ matrix.host }} canary inconclusive::\
          ${{ steps.read.outputs.class }} — the ledger keeps its previous verified row"
