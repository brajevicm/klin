name: quality

# The required `gates` check must always report. Expensive Rust steps are skipped below when a
# pull request changes no Rust-affecting inputs.
on:
  pull_request:

# A newer push to a pull request cancels its older run.
concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Detect Rust-affecting changes
        id: changes
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rust_inputs=(
            src/ tests/
            Cargo.toml Cargo.lock rust-toolchain.toml build.rs
            benches/ examples/
          )
          if git diff --quiet "$CHANGE_BASE...$CHANGE_HEAD" -- "${rust_inputs[@]}"; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "Rust inputs unchanged; skipping the Rust suite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi
      # rust-cache.yml saves this cache on main. A cache saved on one merge ref serves no sibling
      # pull request.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.rust == 'true'
        with:
          shared-key: gates
          save-if: false
      - name: Lint GitHub Actions
        env:
          ACTIONLINT_BASE: ${{ github.event.pull_request.base.sha }}
          ACTIONLINT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$ACTIONLINT_BASE...$ACTIONLINT_HEAD" -- .github/workflows; then
            echo "Workflows unchanged; skipping actionlint."
            exit 0
          fi
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' ! -name 'release.yml' | sort)
          "$(go env GOPATH)/bin/actionlint" "${workflows[@]}"
      - name: Test release validator
        run: |
          python3 -m py_compile .github/validate-release-pr.py .github/test-release-validator.py
          python3 .github/test-release-validator.py
      - name: Validate exact release diff
        if: startsWith(github.event.pull_request.head.ref, 'release/v')
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${RELEASE_REF#release/v}"
          python3 .github/validate-release-pr.py "$RELEASE_BASE" "$RELEASE_HEAD" "$version"
      - name: Validate cargo-dist plan
        env:
          DIST_BASE: ${{ github.event.pull_request.base.sha }}
          DIST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          release_inputs=(
            Cargo.toml Cargo.lock rust-toolchain.toml dist-workspace.toml
            .github/workflows/release.yml .github/verify-tag.yml
            .github/workflows/prepare-release.yml .github/workflows/publish-release.yml
            action.yml .claude-plugin .cursor-plugin .agents/plugins
            plugins/klin/.claude-plugin plugins/klin/.cursor-plugin
          )
          if git diff --quiet "$DIST_BASE...$DIST_HEAD" -- "${release_inputs[@]}"; then
            echo "Release inputs unchanged; skipping dist plan."
            exit 0
          fi
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
          dist plan --output-format=json
      - name: Verify counterfactual research evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          RESEARCH_BASE: ${{ github.event.pull_request.base.sha }}
          RESEARCH_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$RESEARCH_BASE...$RESEARCH_HEAD" -- \
            docs/counterfactual-2026-10-03/ docs/counterfactual-2026-10-03.md \
            .github/workflows/quality.yml)
          if [[ -z "$changed" ]]; then
            echo "Counterfactual research unchanged; skipping its probes and replay."
            exit 0
          fi
          python3 docs/counterfactual-2026-10-03/probe-test.py
          python3 docs/counterfactual-2026-10-03/check-results.py --reproduce
      - run: cargo fmt --check
        if: steps.changes.outputs.rust == 'true'
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: steps.changes.outputs.rust == 'true'
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        if: steps.changes.outputs.rust == 'true'
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo nextest run --locked
        if: steps.changes.outputs.rust == 'true'
      - run: cargo build --locked
        if: steps.changes.outputs.rust == 'true'
      - run: ./target/debug/klin gate --strict
        if: steps.changes.outputs.rust == 'true'