name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked
      - run: ./target/release/klin gate --strict --gate doc-size --gate escapes --gate complexity --gate doc-citations
