name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release --locked
      - run: cargo test --locked
      - run: ./target/release/klin gate --strict --gate doc-size --gate escapes --gate complexity
