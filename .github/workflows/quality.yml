name: quality

# No path filter: klin measures docs, config and workflows too, and a required check that a filter
# skips never reports.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels its older run. Each push to main keeps its own run.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # Only a push to main saves the cache. A pull request restores main's cache, because a cache
      # saved on one merge ref serves no sibling pull request, and a pull request cannot write a
      # cache that main then reads. The key hashes Cargo.toml, Cargo.lock and rust-toolchain.toml,
      # so main saves again only when one of them changes.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo nextest run --locked
      - run: cargo build --locked
      - run: ./target/debug/klin gate --strict
