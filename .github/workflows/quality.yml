name: quality

# No path filter: klin measures docs, config and workflows too, and a required check that a filter
# skips never reports.
on:
  pull_request:

# A newer push to a pull request cancels its older run.
concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # rust-cache.yml saves this cache on main. A cache saved on one merge ref serves no sibling
      # pull request.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gates
          save-if: false
      - name: Verify counterfactual research evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 docs/counterfactual-2026-10-03/probe-test.py
          python3 docs/counterfactual-2026-10-03/check-results.py --reproduce
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo nextest run --locked
      - run: cargo build --locked
      - run: ./target/debug/klin gate --strict