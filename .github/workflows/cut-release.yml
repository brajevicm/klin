name: cut-release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Which part of the version moves
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: An exact version instead, such as 0.3.0. Wins over the level when set.
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-release@1.1.5
      - shell: bash
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
      - run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
      - env:
          GH_TOKEN: ${{ github.token }}
          LEVEL: ${{ inputs.level }}
          VERSION: ${{ inputs.version }}
        run: |
          cargo release "${VERSION:-$LEVEL}" --execute --no-confirm
          tag=$(git describe --tags --exact-match HEAD)
          dist plan --tag="$tag" --output-format=json > "$RUNNER_TEMP/plan.json"
          title=$(jq -er .announcement_title "$RUNNER_TEMP/plan.json")
          jq -er .announcement_github_body "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/notes.md"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --draft --prerelease --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          echo "dist now publishes $tag as a prerelease. Plugin users, releases/latest, the installer and klin update get it only after the release smoke in docs/HOST_COMPATIBILITY.md passes and promote-release runs." >> "$GITHUB_STEP_SUMMARY"
