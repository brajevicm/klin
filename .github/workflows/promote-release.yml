name: promote-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The released version that main takes after the release smoke, such as 0.4.0
        type: string
        required: true

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          tag="v$VERSION"
          tag_sha=$(git rev-parse "$tag^{commit}")
          target=$(gh release view "$tag" --json isDraft,isImmutable,isPrerelease,targetCommitish --jq '
            select(.isDraft == false and .isImmutable == true and .isPrerelease == true) | .targetCommitish
          ')
          if [[ "$target" != "$tag_sha" ]]; then
            echo "::error title=Release not ready::$tag is not the published prerelease for its tag SHA. Wait for Release to finish, run the release smoke, then try again."
            exit 1
          fi

          git fetch origin main --tags
          git checkout -B main origin/main
          git merge --no-edit "$tag"
          git push origin main
          gh release edit "$tag" --prerelease=false --latest
