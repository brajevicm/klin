<meta charset="utf-8" />

<title>klin social preview</title>
<style>
  :root {
    --bg: #fafaf9;
    --ink: #0f172a;
    --muted: #667085;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #e5e7eb;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Helvetica, Arial, sans-serif;
  }

  body {
    display: grid;
    place-items: center;
    padding: 32px;
  }

  .artboard {
    width: 1280px;
    height: 640px;
    background: var(--bg);
    overflow: hidden;
    position: relative;
    padding: 68px 82px;
  }

  .logo {
    width: 226px;
    height: auto;
    display: block;
  }

  .logo svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .accent {
    width: 44px;
    height: 4px;
    border-radius: 999px;
    background: #10b981;
    margin-top: 46px;
  }

  .copy {
    margin-top: 20px;
    max-width: 1010px;
  }

  h1 {
    margin: 0;
    color: var(--ink);
    font-size: 68px;
    line-height: 1.01;
    letter-spacing: -0.04em;
    font-weight: 700;
    text-wrap: balance;
  }

  p {
    margin: 30px 0 0;
    color: var(--muted);
    font-size: 27px;
    line-height: 1.25;
    letter-spacing: -0.015em;
    font-weight: 400;
  }

  @media (max-width: 1344px) {
    body {
      place-items: start center;
      overflow: auto;
    }
  }
</style>
