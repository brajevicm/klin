[package]
name = "klin"
version = "0.5.3"
edition = "2024"
description = "Quality ratchets for AI-driven development, in one binary."
repository = "https://github.com/brajevicm/klin"
license = "Apache-2.0"

[package.metadata.release]
allow-branch = ["main"]
publish = false
push = false
tag = false
pre-release-commit-message = "Release {{version}}"
tag-message = "Release {{version}}"
pre-release-replacements = [
  { file = "plugins/klin/.claude-plugin/plugin.json", search = "\"version\": \"[0-9.]+\"", replace = "\"version\": \"{{version}}\"", exactly = 1 },
  { file = "plugins/klin/.cursor-plugin/plugin.json", search = "\"version\": \"[0-9.]+\"", replace = "\"version\": \"{{version}}\"", exactly = 1 },
  { file = ".claude-plugin/marketplace.json", search = "\"ref\": \"v[0-9.]+\"", replace = "\"ref\": \"v{{version}}\"", exactly = 1 },
  { file = ".agents/plugins/marketplace.json", search = "\"ref\": \"v[0-9.]+\"", replace = "\"ref\": \"v{{version}}\"", exactly = 1 },
  { file = "README.md", search = "brajevicm/klin@v[0-9.]+", replace = "brajevicm/klin@v{{version}}", exactly = 1 },
  { file = "README.md", search = "--branch v[0-9.]+", replace = "--branch v{{version}}", exactly = 1 },
]

[dependencies]
ast-grep-core = "0.45.3"
cargo_toml = "1.0.1"
clap = { version = "4.6.6", features = ["derive"] }
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
regex = "1.13.1"
rustix = { version = "1.1.4", features = ["process"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
tempfile = "3.27.0"
toml = "1.1.6"
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", features = ["pty"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
